        DestinationConfiguration:
          DestinationType: cloud-watch-logs
          DestinationPattern: /aws/bedrock-agentcore/<resourceId>/<logType>
          LogDeliveryParameters:
            LogTypes:
              - APPLICATION_LOGS

  TelemetryRuleWorkloadIdentityTraces:
    Type: Custom::TelemetryRule
    DependsOn: AgentCoreXRayResourcePolicy
    Condition: WorkloadIdentityEnabled
    Properties:
      ServiceToken: !GetAtt TelemetryRuleFunction.Arn
      RuleName: agentcore-workloadidentity-traces
      Rule:
        ResourceType: AWS::BedrockAgentCore::WorkloadIdentity
        TelemetryType: Traces
        Regions:
          - !Ref "AWS::Region"

Outputs:
  HandlerFunctionArn:
    Description: ARN of the inline telemetry-rule custom-resource Lambda.
    Value: !GetAtt TelemetryRuleFunction.Arn
  ExecutionRoleArn:
    Description: ARN of the least-privilege Lambda execution role.
    Value: !GetAtt TelemetryRuleFunctionRole.Arn
  XRayResourcePolicyName:
    Condition: AnyTelemetryEnabled
    Description: Name of the X-Ray resource policy authorizing AgentCore trace delivery.
    Value: AWSLogDeliveryAgentCoreXRay
